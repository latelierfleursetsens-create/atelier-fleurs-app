<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyBusiness PRA local</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f2ef;color:#392f32}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e6d8d3;border-radius:14px;padding:16px;margin:12px 0}.btn{background:#7b4354;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.muted{color:#776b6e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.kpi{background:#fbf5f3;border:1px solid #eadbd6;border-radius:10px;padding:12px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid #d9c5bf;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.tabs button.on{background:#7b4354;color:#fff}.row{padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}input[type=search]{width:100%;padding:10px;border:1px solid #d9c5bf;border-radius:8px;box-sizing:border-box}.badge{display:inline-block;background:#f1e2dd;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #eee;padding:8px;vertical-align:top}@media(max-width:700px){table{display:block;overflow:auto}}</style></head><body><div class="wrap"><h1>🛡️ MyBusiness — Mode PRA local</h1><p class="muted">Lecture seule. Fonctionne localement sans Firebase, GitHub ni Cloudflare. Choisis une sauvegarde JSON MyBusiness.</p><div class="card"><input id="file" type="file" accept="application/json,.json"> <span id="status" class="muted"></span></div><div id="app" style="display:none"><div id="kpis" class="grid"></div><div class="tabs" id="tabs"></div><div class="card"><input id="q" type="search" placeholder="Rechercher un nom, e-mail, numéro de devis…"><div id="content"></div></div></div></div>
<script>
let D=null,tab='mariages'; const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const arr=k=>Array.isArray(D?.[k])?D[k]:[]; const money=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}); const date=v=>{if(!v)return'';let d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('fr-FR')};
function totalDoc(x){if(Number.isFinite(Number(x.total)))return Number(x.total); if(Number.isFinite(Number(x.totalTTC)))return Number(x.totalTTC); return (x.lignes||[]).reduce((s,l)=>s+(Number(l.qte)||1)*(Number(l.prix)||0),0)}
function render(){document.getElementById('app').style.display='block'; let saved=D?._meta?.savedAt||D?._meta?.praExportAt||''; document.getElementById('kpis').innerHTML=[['Mariages',arr('mariages').length],['Clients',arr('clients').length],['Devis',arr('devis').length],['Factures',arr('factures').length],['Ateliers',arr('ateliers').length],['Sauvegarde',saved?date(saved):'—']].map(x=>`<div class=kpi><b>${esc(x[0])}</b><div style="font-size:24px;margin-top:4px">${esc(x[1])}</div></div>`).join(''); let tabs=[['mariages','Mariages'],['clients','Clients'],['devis','Devis'],['factures','Factures'],['ateliers','Ateliers']];document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="${tab===x[0]?'on':''}" data-t="${x[0]}">${x[1]} (${arr(x[0]).length})</button>`).join(''); document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()}); draw();}
function draw(){let q=(document.getElementById('q').value||'').toLowerCase();let xs=arr(tab).filter(x=>JSON.stringify(x).toLowerCase().includes(q));let html='';if(tab==='mariages')html='<table><tr><th>Cliente</th><th>Date mariage</th><th>Statut</th><th>Coordonnées</th><th>Besoins / notes</th></tr>'+xs.map(x=>`<tr><td><b>${esc(x.nom||x.clientNom||x.prenom||'')}</b></td><td>${esc(date(x.dateMariage||x.date))}</td><td><span class=badge>${esc(x.statut||x.status||'')}</span></td><td>${esc(x.email||'')}<br>${esc(x.tel||x.telephone||'')}</td><td>${esc(x.besoins||x.notes||x.memo||'')}</td></tr>`).join('')+'</table>';
else if(tab==='clients')html='<table><tr><th>Nom</th><th>Email</th><th>Téléphone</th><th>Adresse</th></tr>'+xs.map(x=>`<tr><td><b>${esc(x.nom||'')}</b></td><td>${esc(x.email||'')}</td><td>${esc(x.tel||x.telephone||'')}</td><td>${esc(x.adresse||'')}</td></tr>`).join('')+'</table>';
else if(tab==='devis'||tab==='factures')html='<table><tr><th>Numéro</th><th>Client</th><th>Date</th><th>Statut</th><th>Montant</th></tr>'+xs.map(x=>`<tr><td><b>${esc(x.numero||x.num||'')}</b></td><td>${esc(x.clientNom||x.nomClient||x.client?.nom||'')}</td><td>${esc(date(x.date||x.createdAt))}</td><td>${esc(x.statut||x.status||'')}</td><td>${money(totalDoc(x))}</td></tr>`).join('')+'</table>';
else html='<table><tr><th>Atelier</th><th>Date</th><th>Statut</th><th>Participants</th></tr>'+xs.map(x=>`<tr><td><b>${esc(x.nom||x.titre||x.type||'')}</b></td><td>${esc(date(x.date))}</td><td>${esc(x.statut||'')}</td><td>${esc(x.participants||x.nbParticipants||'')}</td></tr>`).join('')+'</table>';document.getElementById('content').innerHTML=html||'<p class=muted>Aucun résultat.</p>';}
document.getElementById('q').oninput=draw; document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{D=JSON.parse(r.result);document.getElementById('status').textContent='✅ '+f.name+' chargé';render()}catch(err){document.getElementById('status').textContent='❌ JSON illisible'}};r.readAsText(f)};
</script></body></html>
