<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace mariage sécurisé — L’Atelier Fleurs & Sens</title>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>
<style>:root{--b:#6f2638;--p:#f7eeea;--g:#b48a55;--t:#30262a}*{box-sizing:border-box}body{margin:0;background:#fbf8f6;color:var(--t);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.hero,.card{background:#fff;border:1px solid #eadfd8;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px #6332}.hero{text-align:center}.hero img{width:110px;border-radius:50%}h1,h2{color:var(--b)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}label{display:block;font-weight:600}input,select,textarea{width:100%;margin-top:6px;padding:12px;border:1px solid #d8c9c1;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}.primary{background:var(--b);color:#fff}.soft{background:var(--p);color:var(--b)}.hidden{display:none!important}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid #eadfd8;border-radius:12px;padding:11px}.choice input{width:18px;margin:2px 0}.muted{color:#796c70;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab.active{background:var(--b);color:#fff}.doc{border:1px solid #eadfd8;border-radius:12px;padding:14px;margin:10px 0}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--p);color:var(--b);font-size:12px}.doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ok{background:#e5f3e7;color:#285b32}.warn{background:#fff0dc;color:#7a4b0b}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{position:relative}.photo img{width:100%;height:150px;object-fit:cover;border-radius:12px}.photo button{position:absolute;right:6px;top:6px;border:0;border-radius:50%;width:30px;height:30px;background:#6f2638;color:#fff}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><section class="hero"><img src="assets/logo.jpg"><h1>Mon espace mariage 🌸</h1><p>Un espace personnel pour compléter votre projet et retrouver vos documents.</p><p class="muted">V5.1.3 SECURE TEST</p></section>
<section id="authCard" class="card"><div class="tabs"><button class="btn tab active" id="loginTab">Connexion</button><button class="btn tab soft" id="signupTab">Créer mon espace</button></div><div class="grid"><label>E-mail<input id="email" type="email"></label><label>Mot de passe<input id="password" type="password" minlength="8"></label></div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="authAction">Me connecter</button><button class="btn soft" id="resetPwd">Mot de passe oublié</button></div><p id="authMsg" class="muted"></p></section>
<section id="space" class="hidden"><div class="card top"><div><b id="welcome"></b><div class="muted" id="userEmail"></div></div><button class="btn soft" id="logout">Se déconnecter</button></div><div class="tabs"><button class="btn tab active" data-view="project">Ma fiche</button><button class="btn tab soft" data-view="docs">Devis et factures</button></div>
<section id="projectView" class="card"><h2>Mon projet</h2><form id="projectForm"><div class="grid"><label>Prénom *<input name="prenom" required></label><label>Nom *<input name="nom" required></label><label>Téléphone *<input name="tel" required></label><label>Date du mariage *<input name="dateMariage" type="date" required></label><label>Ville<input name="ville"></label><label>Lieu<input name="lieu"></label><label>Nombre d’invités<input name="invites" type="number"></label><label>Style<input name="style"></label><label>Budget<input name="budget"></label><label>Couleurs<input name="couleurs"></label></div><h2>Mes besoins</h2><div id="choices" class="checks"></div><label style="margin-top:12px">Autre demande<input name="autrePrestation"></label><div class="grid" style="margin-top:13px"><label>Fleurs appréciées<textarea name="fleursAimees"></textarea></label><label>Éléments refusés<textarea name="fleursRefusees"></textarea></label></div><label style="margin-top:13px">Description du projet<textarea name="description" rows="5"></textarea></label><h2>Inspirations</h2><input id="photos" type="file" accept="image/*" multiple><div id="photosList" class="photos" style="margin-top:12px"></div><button class="btn primary" style="margin-top:16px">Enregistrer ma fiche</button><p id="saveMsg" class="muted"></p></form></section>
<section id="docsView" class="card hidden"><h2>Mes devis et factures</h2><div id="docs"></div></section></section></main>
<script src="js/mariage-creations.js?v=5.1.3-secure-test"></script><script>
var config={apiKey:"AIzaSyCPuUcFt99zQsUI1lBDSEZkX-RJHtgs5BY",authDomain:"l-atelier-fleurs-et-sens.firebaseapp.com",projectId:"l-atelier-fleurs-et-sens",storageBucket:"l-atelier-fleurs-et-sens.firebasestorage.app",messagingSenderId:"520271601373",appId:"1:520271601373:web:150541ed9bf7091b804534"};// Application Firebase nommée pour isoler totalement la session cliente de MyBusiness.
// Sans cela, la connexion d'une cliente dans un onglet remplaçait la session administratrice
// dans les autres onglets du même navigateur, puis MyBusiness déconnectait la cliente.
var clientApp;
try{clientApp=firebase.app('clientPortal')}catch(_){clientApp=firebase.initializeApp(config,'clientPortal')}
var auth=clientApp.auth(),db=clientApp.firestore(),storage=clientApp.storage(),mode='login',current=null,project={photos:[]};
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(function(e){console.warn('Persistance session cliente indisponible',e)});
function $(id){return document.getElementById(id)}function msg(t){$('authMsg').textContent=t||''}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function euro(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0))}
var choices=window.MARIAGE_CREATIONS_STANDARD||[];$('choices').innerHTML=choices.map((x,i)=>'<label class="choice"><input type="checkbox" name="prestations" value="'+esc(x)+'"><span>'+esc(x)+'</span></label>').join('');
function setMode(m){mode=m;$('loginTab').className='btn tab '+(m==='login'?'active':'soft');$('signupTab').className='btn tab '+(m==='signup'?'active':'soft');$('authAction').textContent=m==='login'?'Me connecter':'Créer mon espace'}$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
$('authAction').onclick=async()=>{try{msg(mode==='signup'?'Création de votre espace…':'Connexion…');await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);var e=$('email').value.trim(),p=$('password').value;if(mode==='signup'){var c=await auth.createUserWithEmailAndPassword(e,p);await db.collection('clientProfiles').doc(c.user.uid).set({email:e,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}else await auth.signInWithEmailAndPassword(e,p);msg('')}catch(e){msg(e.message)}};$('resetPwd').onclick=async()=>{try{await auth.sendPasswordResetEmail($('email').value.trim());msg('E-mail de réinitialisation envoyé.')}catch(e){msg(e.message)}};$('logout').onclick=()=>auth.signOut();
async function loadProject(){var snap=await db.collection('portalProjects').doc(current.uid).get();project=snap.exists?snap.data():{ownerUid:current.uid,email:current.email,photos:[]};var f=$('projectForm');['prenom','nom','tel','dateMariage','ville','lieu','invites','style','budget','couleurs','autrePrestation','fleursAimees','fleursRefusees','description'].forEach(k=>{if(f.elements[k])f.elements[k].value=project[k]||''});Array.from(f.querySelectorAll('[name=prestations]')).forEach(x=>x.checked=(project.prestations||[]).includes(x.value));renderPhotos();$('welcome').textContent=project.prenom?'Bonjour '+project.prenom+' 🌸':'Bienvenue 🌸'}
function renderPhotos(){$('photosList').innerHTML=(project.photos||[]).map((p,i)=>'<div class="photo"><img src="'+esc(p.url)+'"><button type="button" data-del="'+i+'">×</button></div>').join('')}$('photosList').onclick=async e=>{var i=e.target.getAttribute('data-del');if(i==null)return;var p=project.photos[+i];if(p&&p.path)try{await storage.ref(p.path).delete()}catch(x){}project.photos.splice(+i,1);await db.collection('portalProjects').doc(current.uid).set({ownerUid:current.uid,email:current.email,photos:project.photos,clientStatus:'draft',createdAt:project.createdAt||new Date().toISOString(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});renderPhotos()};
$('photos').onchange=async e=>{var files=Array.from(e.target.files||[]).slice(0,Math.max(0,6-(project.photos||[]).length));for(var f of files){if(f.size>5*1024*1024){alert('Photo trop lourde (5 Mo maximum).');continue}var path='clientUploads/'+current.uid+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');var ref=storage.ref(path);await ref.put(f);var url=await ref.getDownloadURL();project.photos=project.photos||[];project.photos.push({name:f.name,path:path,url:url})}await db.collection('portalProjects').doc(current.uid).set({ownerUid:current.uid,email:current.email,photos:project.photos,clientStatus:'draft',createdAt:project.createdAt||new Date().toISOString(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});renderPhotos();e.target.value=''};
$('projectForm').onsubmit=async e=>{e.preventDefault();var fd=new FormData(e.target),data={ownerUid:current.uid,email:current.email,prenom:fd.get('prenom'),nom:fd.get('nom'),tel:fd.get('tel'),dateMariage:fd.get('dateMariage'),ville:fd.get('ville'),lieu:fd.get('lieu'),invites:fd.get('invites'),style:fd.get('style'),budget:fd.get('budget'),couleurs:fd.get('couleurs'),prestations:fd.getAll('prestations'),autrePrestation:fd.get('autrePrestation'),fleursAimees:fd.get('fleursAimees'),fleursRefusees:fd.get('fleursRefusees'),description:fd.get('description'),photos:project.photos||[],clientStatus:'submitted',updatedAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:project.createdAt||new Date().toISOString()};await db.collection('portalProjects').doc(current.uid).set(data,{merge:true});project=Object.assign(project,data);$('saveMsg').textContent='Votre fiche est enregistrée.';setTimeout(()=>$('saveMsg').textContent='',3000)};
async function loadDocs(){var q=await db.collection('portalDocuments').where('ownerUid','==',current.uid).get(),a=[];q.forEach(d=>a.push(Object.assign({id:d.id},d.data())));a.sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));$('docs').innerHTML=a.length?a.map(function(d){var decision=d.clientDecision||'';var actions='';if(d.kind==='devis'){actions='<div class="doc-actions">'+(decision==='accepted'?'<span class="status ok">Devis validé par vous</span>':'<button class="btn primary" data-accept="'+esc(d.id)+'">Valider ce devis</button>')+(decision==='changes_requested'?'<span class="status warn">Modification demandée</span>':'<button class="btn soft" data-change="'+esc(d.id)+'">Demander une modification</button>')+'</div>';}return '<div class="doc"><div class="top"><b>'+(d.kind==='devis'?'Devis ':'Facture ')+esc(d.numero)+'</b><span class="status">'+esc(d.statut)+'</span></div><p>'+esc(d.date)+' · <b>'+euro(d.montant)+'</b></p>'+(d.lignes||[]).map(l=>'<div class="muted">'+esc(l.description)+' · '+euro(l.total||l.prix*l.quantite)+'</div>').join('')+actions+'</div>'}).join(''):'<p class="muted">Aucun document disponible pour le moment.</p>'}
$('docs').onclick=async function(e){var id=e.target.getAttribute('data-accept')||e.target.getAttribute('data-change');if(!id)return;var accepted=!!e.target.getAttribute('data-accept');var message='';if(!accepted){message=prompt('Indiquez brièvement la modification souhaitée :')||'';if(!message.trim())return;}if(accepted&&!confirm('Confirmez-vous la validation de ce devis ?'))return;await db.collection('portalDocuments').doc(id).update({clientDecision:accepted?'accepted':'changes_requested',clientDecisionAt:firebase.firestore.FieldValue.serverTimestamp(),clientDecisionMessage:message,clientDecisionBy:current.uid});await loadDocs();};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.className='btn tab soft');b.className='btn tab active';$('projectView').classList.toggle('hidden',b.dataset.view!=='project');$('docsView').classList.toggle('hidden',b.dataset.view!=='docs');if(b.dataset.view==='docs')loadDocs()});
auth.onAuthStateChanged(async u=>{current=u;$('authCard').classList.toggle('hidden',!!u);$('space').classList.toggle('hidden',!u);if(u){$('userEmail').textContent=u.email;try{await loadProject();msg('')}catch(e){console.error(e);$('saveMsg').textContent='Connexion réussie, mais la fiche ne peut pas encore être chargée : '+e.message}}else{project={photos:[]}}});
</script></body></html>
